name = "church-meeting-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
account_id = "8e2eb47cb86e3cfb953c89dd148b6137"

# 查經邀請頁的短網址（LINE 分享用）。liming-tjc.org 的 DNS 在同一個 Cloudflare 帳號，
# 部署時會自動建立這個子網域的紀錄。網址格式 https://study.liming-tjc.org/10-28
# 不加這段也能用，只是要走 https://church-meeting-api.c3012312.workers.dev/invite/10-28
#
# ⚠️ 這行一定要放在所有 [區段] 標頭之前。TOML 是區段作用域，放到 [triggers] 後面會被
# 當成 triggers.routes，wrangler 只會印一行 WARNING 然後照常部署，自訂網域靜靜地沒生效。
routes = [{ pattern = "study.liming-tjc.org", custom_domain = true }]

# ⚠️ 一旦設了 routes，workers_dev 就預設變成 false，`church-meeting-api.c3012312.workers.dev`
# 會直接 404 —— 而前端 api.js 的 API_URL 正是指到那裡，整個網站會掛掉（2026-10-22 踩過）。
# 這行一定要留著。
workers_dev = true

[vars]
# 用寫死版本名稱避免 "*-latest" alias 偶爾指到區域沒部署的版本造成 503
GEMINI_MODEL = "gemini-2.5-flash"
# 設定與資料都在試算表「查經聚會轉檔紀錄」（使用者自己的那本，2026-10-23 起）：
#   Config 分頁 → 設定（Worker 讀 Config!A:B）
#   安排表／問題討論分頁 → 系統寫、人可以改的資料
# 兩個 ID 分開寫是為了之後想拆開時不用改程式；服務帳號要有編輯權，缺的工作表程式會自己建
CONFIG_SHEET_ID = "1EPWYm4HJHaWy0zNR7-HgYDf9MbPGd1LFAPlbMnU9IUk"
DATA_SHEET_ID = "1EPWYm4HJHaWy0zNR7-HgYDf9MbPGd1LFAPlbMnU9IUk"
# 主表只放查經邀請頁的 STUDY_*；錄音轉檔用的講員清單、略過關鍵字、Gemini prompt 留在 LINE 小幫手那本
# 「Line發送功能(小幫手)」的 Config 分頁，主表沒有的 key 會來這裡補讀。
# 分兩本是刻意的（2026-10-23 使用者決定：轉檔設定穩定，不搬不動），這行不要刪。
CONFIG_FALLBACK_SHEET_ID = "1F7fP03oexK4lrerV-hRHM1ooKirwZnuguCerGK6jogo"
# Free tier 限 50 subrequest/invocation：每檔處理用 ~25 個 subrequest + cron 預載 ~8 個 ≈ 33
# 第 2 個檔就會爆「Too many subrequests」→ 一次 cron 只跑 1 個檔
QUOTA_PER_RUN = "1"

# 排程：每天 06:30 + 12:30 + 16:00 + 21:30 Asia/Taipei（UTC 22:30前夜 + 04:30 + 08:00 + 13:30）
# 4 次 cron × 每次 1 檔 = 一天最多 4 檔自動處理
# 每輪優先做重試（sweepAndRetryOne），沒有待重試項目才處理新檔
# 改動時間時，meeting.js 的說明文字與 getNextScheduleTime() 也要同步更新
# Cloudflare Free 方案最多 5 個 cron
# Cron 格式：minute hour day-of-month month day-of-week（時間都是 UTC）
[triggers]
crons = ["30 22 * * *", "30 4 * * *", "0 8 * * *", "30 13 * * *"]

# KV：手動轉錄排隊（建立後填入 id）
# 建立指令：npx wrangler kv namespace create PROCESS_QUEUE
[[kv_namespaces]]
binding = "PROCESS_QUEUE"
id = "daa2816cade04632a507af8082dff906"

# 啟用 Workers Logs（持久化 log，可在 Dashboard → Observability → Logs 查詢）
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Secrets（不寫在這裡，用 Dashboard 或以下指令設定）：
#   npx wrangler secret put SERVICE_ACCOUNT_KEY
#   npx wrangler secret put NOTION_TOKEN
#   npx wrangler secret put NOTION_DATABASE_ID
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put DRIVE_FOLDER_ID
#
# 也可選填限制 CORS 來源：
#   npx wrangler secret put ALLOWED_ORIGIN
