<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <!-- 首頁行事曆的資料組裝流程（app.js attachEntries）
       改動 app.js 的 L1/L2/L3 時請同步更新這張圖。 -->
  <rect x="0" y="0" width="1020" height="700" fill="#fbfbfd" stroke="#d7dae0" rx="8"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#1a1d24">首頁行事曆：一格是怎麼組出來的</text>
  <text x="30" y="62" font-size="13" fill="#5c6270">app.js — getDays() → attachEntries()　｜　三層去重基準統一為 Drive fileId</text>

  <!-- Step 0 -->
  <rect x="30" y="84" width="960" height="46" fill="#e8ecf4" stroke="#b9c2d4" rx="6"/>
  <text x="50" y="106" font-size="14" font-weight="700" fill="#1a1d24">① buildDaysForMonth()</text>
  <text x="50" y="123" font-size="12.5" fill="#4a5164">先展開該月（或整年）的空日期骨架，每天一個 day-card，items 為空陣列</text>

  <path d="M510 130 L510 152" stroke="#8b93a6" stroke-width="1.6" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#8b93a6"/>
    </marker>
  </defs>

  <text x="30" y="172" font-size="14" font-weight="700" fill="#1a1d24">② attachEntries() — 依序疊三層（順序不可換）</text>

  <!-- L1 -->
  <rect x="30" y="186" width="305" height="250" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
  <rect x="30" y="186" width="305" height="34" fill="#7c9cc4" rx="7"/>
  <rect x="30" y="210" width="305" height="10" fill="#7c9cc4"/>
  <text x="46" y="209" font-size="14.5" font-weight="700" fill="#ffffff">L1　Notion 紀錄</text>
  <text x="46" y="244" font-size="12.5" fill="#4a5164">來源　state.notionMeetings</text>
  <text x="46" y="268" font-size="13" font-weight="700" fill="#1a1d24">判斷</text>
  <rect x="46" y="278" width="273" height="30" fill="#eef3f9" stroke="#c3d2e4" rx="4"/>
  <text x="58" y="298" font-size="12.5" fill="#2f3646">無條件 push，完全不去重、不合併</text>
  <text x="46" y="330" font-size="12.5" fill="#6b7183">同一天有幾筆就顯示幾筆，</text>
  <text x="46" y="348" font-size="12.5" fill="#6b7183">連 topic 相同也各佔一列。</text>
  <text x="46" y="380" font-size="13" font-weight="700" fill="#1a1d24">產出</text>
  <rect x="46" y="390" width="118" height="26" fill="#dbe7f5" stroke="#7c9cc4" rx="13"/>
  <text x="60" y="408" font-size="12.5" fill="#243349">_state: filled</text>
  <text x="46" y="428" font-size="12" fill="#6b7183">徽章依 status：已發布／草稿／待重試…</text>

  <!-- L2 -->
  <rect x="357" y="186" width="305" height="250" fill="#ffffff" stroke="#c9a15c" stroke-width="1.6" rx="7"/>
  <rect x="357" y="186" width="305" height="34" fill="#c9a15c" rx="7"/>
  <rect x="357" y="210" width="305" height="10" fill="#c9a15c"/>
  <text x="373" y="209" font-size="14.5" font-weight="700" fill="#ffffff">L2　Drive 錄音</text>
  <text x="373" y="244" font-size="12.5" fill="#4a5164">來源　state.driveFiles（按月）</text>
  <text x="373" y="268" font-size="13" font-weight="700" fill="#1a1d24">判斷</text>
  <rect x="373" y="278" width="273" height="30" fill="#faf3e6" stroke="#e0cba2" rx="4"/>
  <text x="385" y="298" font-size="12.5" fill="#2f3646">fileId 已在 Notion audioUrl → 跳過</text>
  <text x="373" y="330" font-size="12.5" fill="#6b7183">比對集合來自 L1，所以 L1 必須先跑。</text>
  <text x="373" y="348" font-size="12.5" fill="#6b7183">同內容不同 fileId 會各自成列。</text>
  <text x="373" y="380" font-size="13" font-weight="700" fill="#1a1d24">產出</text>
  <rect x="373" y="390" width="130" height="26" fill="#f6e9cf" stroke="#c9a15c" rx="13"/>
  <text x="387" y="408" font-size="12.5" fill="#3d3320">_state: pending</text>
  <text x="373" y="428" font-size="12" fill="#6b7183">徽章：🎙 待轉錄</text>

  <!-- L3 -->
  <rect x="684" y="186" width="306" height="250" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
  <rect x="684" y="186" width="306" height="34" fill="#7fa87f" rx="7"/>
  <rect x="684" y="210" width="306" height="10" fill="#7fa87f"/>
  <text x="700" y="209" font-size="14.5" font-weight="700" fill="#ffffff">L3　Drive 預查</text>
  <text x="700" y="244" font-size="12.5" fill="#4a5164">來源　state.studyDocs（一次全載）</text>
  <text x="700" y="268" font-size="13" font-weight="700" fill="#1a1d24">判斷</text>
  <rect x="700" y="278" width="274" height="30" fill="#eef5ee" stroke="#bfd6bf" rx="4"/>
  <text x="712" y="298" font-size="12.5" fill="#2f3646">fileId 已在 Notion studyUrl → 跳過</text>
  <text x="700" y="330" font-size="12.5" fill="#6b7183">日期用 estimatedDate（createdTime 推算，</text>
  <text x="700" y="348" font-size="12.5" fill="#6b7183">不讀內文，不一定準）。</text>
  <text x="700" y="380" font-size="13" font-weight="700" fill="#1a1d24">產出</text>
  <rect x="700" y="390" width="168" height="26" fill="#dfeddf" stroke="#7fa87f" rx="13"/>
  <text x="714" y="408" font-size="12.5" fill="#23301f">_state: pending-study</text>
  <text x="700" y="428" font-size="12" fill="#6b7183">徽章：📖 待處理預查　type 固定「週三晚間」</text>

  <!-- 歷史註記 -->
  <rect x="30" y="450" width="960" height="44" fill="#fdf1f1" stroke="#e6b9b9" rx="6"/>
  <text x="46" y="470" font-size="12.5" font-weight="700" fill="#8a3838">2026-08 移除：L3 原本還有一道「同一天同 topic 就把 doc 掛到既有項目上」的合併</text>
  <text x="46" y="487" font-size="12.5" fill="#7a4242">但 studyDoc 的繪製都被 st === 'pending-study' 包住，掛到 filled／pending 項目上不會被畫出來 → 檔案默默消失</text>

  <path d="M510 494 L510 516" stroke="#8b93a6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 點擊行為 -->
  <text x="30" y="536" font-size="14" font-weight="700" fill="#1a1d24">③ _state 決定點擊行為</text>

  <rect x="30" y="550" width="305" height="118" fill="#ffffff" stroke="#b9c2d4" rx="6"/>
  <text x="46" y="572" font-size="12.5" font-weight="700" fill="#243349">filled → data-action="open"</text>
  <text x="46" y="594" font-size="12" fill="#5c6270">meeting.html?id=&lt;notionId&gt;</text>
  <text x="46" y="616" font-size="12" fill="#5c6270">直接讀 Notion 顯示內容</text>
  <text x="46" y="650" font-size="11.5" fill="#8b93a6">錄音頁每次進入都要按 AI 聲明</text>

  <rect x="357" y="550" width="305" height="118" fill="#ffffff" stroke="#b9c2d4" rx="6"/>
  <text x="373" y="572" font-size="12.5" font-weight="700" fill="#3d3320">pending → data-action="process"</text>
  <text x="373" y="594" font-size="12" fill="#5c6270">meeting.html?audioFileId=…</text>
  <text x="373" y="616" font-size="12" fill="#5c6270">⚠ 不觸發轉檔，只是換頁</text>
  <text x="373" y="650" font-size="11.5" fill="#8b93a6">在下一頁按「加入轉錄排隊」才寫入 KV</text>

  <rect x="684" y="550" width="306" height="118" fill="#ffffff" stroke="#b9c2d4" rx="6"/>
  <text x="700" y="572" font-size="12.5" font-weight="700" fill="#23301f">pending-study → "process-study"</text>
  <text x="700" y="594" font-size="12" fill="#5c6270">當場同步呼叫 worker（約 7~15 秒）</text>
  <text x="700" y="616" font-size="12" fill="#5c6270">一律先轉，日期不準進 Notion 改</text>
  <text x="700" y="650" font-size="11.5" fill="#8b93a6">requireContentDate 只用在 cron 自動處理</text>
</svg>
