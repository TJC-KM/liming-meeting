<text x="814" y="362" font-size="12.5" font-weight="700" fill="#1a1d24">唯一正本，也是後台</text>
<text x="814" y="381" font-size="12.5" fill="#4a5164">聚會日期、類型、主題、講員</text>
<text x="814" y="400" font-size="12.5" fill="#4a5164">內文：AI 整理或預查文字</text>
<text x="814" y="419" font-size="12.5" fill="#4a5164">錄音、預查、完整文件連結</text>
<text x="814" y="438" font-size="12.5" fill="#4a5164">✎ 人工校對、改日期、改講員</text>
<text x="814" y="457" font-size="12.5" fill="#4a5164">✎ 狀態：草稿→已發布；傳錯→不採用</text>
