<text x="814" y="182" font-size="14.5" font-weight="700" fill="#ffffff">Gemini（Google AI）</text>
<text x="814" y="210" font-size="12.5" fill="#4a5164">整理錄音：設定檔的 GEMINI_MODEL</text>
<text x="814" y="229" font-size="12.5" fill="#4a5164">　目前 gemini-flash-latest，每天次數有限</text>
<text x="814" y="248" font-size="12.5" fill="#4a5164">抽問題討論（規則抓不到時）：</text>
<text x="814" y="267" font-size="12.5" fill="#4a5164">　gemini-3.5-flash-lite，額度另計</text>
