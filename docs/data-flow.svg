<rect x="30" y="184" width="260" height="8" fill="#7c9cc4"/>
<text x="44" y="182" font-size="14.5" font-weight="700" fill="#ffffff">聚會錄音</text>
<text x="44" y="210" font-size="12.5" fill="#4a5164">Drive 聚會錄音資料夾</text>
<text x="44" y="229" font-size="12.5" fill="#4a5164">同工上傳，檔名開頭要有日期</text>
<text x="44" y="248" font-size="12.5" fill="#4a5164">例：2026-07-25 講題(講員).mp3</text>
<rect x="30" y="291" width="260" height="130" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="30" y="291" width="260" height="30" fill="#7fa87f" rx="7"/>
<rect x="30" y="313" width="260" height="8" fill="#7fa87f"/>
<text x="44" y="311" font-size="14.5" font-weight="700" fill="#ffffff">預查文件</text>
<text x="44" y="339" font-size="12.5" fill="#4a5164">Drive 預查資料夾 → 書卷子資料夾</text>
<text x="44" y="358" font-size="12.5" fill="#4a5164">主領週三晚上上傳（Word／PDF／PPT）</text>
<text x="44" y="377" font-size="12.5" fill="#4a5164">經 LINE 小幫手傳的檔名會變成</text>
<text x="44" y="396" font-size="12.5" fill="#4a5164">　日期_時間_傳送者_原檔名</text>
<rect x="30" y="439" width="260" height="111" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="30" y="439" width="260" height="30" fill="#7fa87f" rx="7"/>
<rect x="30" y="461" width="260" height="8" fill="#7fa87f"/>
<text x="44" y="459" font-size="14.5" font-weight="700" fill="#ffffff">每月聚會安排表</text>
<text x="44" y="487" font-size="12.5" fill="#4a5164">Drive「05安排表」</text>
<text x="44" y="506" font-size="12.5" fill="#4a5164">&lt;民國年&gt;&lt;月&gt;聚會安排表.xlsx</text>
<text x="44" y="525" font-size="12.5" fill="#4a5164">週三那列：進度、預查、領會</text>
<rect x="30" y="568" width="260" height="149" fill="#ffffff" stroke="#8b93a6" stroke-width="1.6" rx="7"/>
<rect x="30" y="568" width="260" height="30" fill="#8b93a6" rx="7"/>
<rect x="30" y="590" width="260" height="8" fill="#8b93a6"/>
<text x="44" y="588" font-size="14.5" font-weight="700" fill="#ffffff">設定試算表（兩本）</text>
<text x="44" y="616" font-size="12.5" fill="#4a5164">查經聚會轉檔紀錄 › Config</text>
<text x="44" y="635" font-size="12.5" fill="#4a5164">　Meet 連結、卡片文字、範本連結</text>
<text x="44" y="654" font-size="12.5" fill="#4a5164">LINE 小幫手那本 › Config</text>
<text x="44" y="673" font-size="12.5" fill="#4a5164">　Gemini 指示、講員清單、略過關鍵字</text>
<text x="44" y="692" font-size="12.5" fill="#4a5164">改完 1 分鐘生效，不用重新部署</text>
<rect x="345" y="154" width="375" height="688" fill="#f1f3f7" stroke="#b9c2d4" rx="8"/>
<text x="359" y="176" font-size="14.5" font-weight="700" fill="#1a1d24">Cloudflare Worker：church-meeting-api</text>
<text x="359" y="196" font-size="12" fill="#5c6270">排程每天 06:30 · 12:30 · 16:00 · 21:30，每次處理一份</text>
<rect x="360" y="212" width="345" height="149" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
<rect x="360" y="212" width="345" height="30" fill="#7c9cc4" rx="7"/>
<rect x="360" y="234" width="345" height="8" fill="#7c9cc4"/>
<text x="374" y="232" font-size="14.5" font-weight="700" fill="#ffffff">錄音轉檔</text>
<text x="374" y="260" font-size="12.5" fill="#4a5164">順序：手動排隊 → 重試（06:30、16:00）→ 新檔</text>
<text x="374" y="279" font-size="12.5" fill="#4a5164">略過：婚禮、喪禮、詩班；&gt;150MB 或 &lt;1MB</text>
<text x="374" y="298" font-size="12.5" fill="#4a5164">下載錄音 → Gemini 整理成</text>
<text x="374" y="317" font-size="12.5" fill="#4a5164">　簡易重點／完整重點／參考經文</text>
<text x="374" y="336" font-size="12.5" fill="#4a5164">寫進 Notion（草稿），失敗自動重試 3 次</text>
<rect x="360" y="373" width="345" height="130" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="373" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="395" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="393" font-size="14.5" font-weight="700" fill="#ffffff">預查轉檔</text>
<text x="374" y="421" font-size="12.5" fill="#4a5164">21:30 處理 14 天內上傳的；06:30 補轉 36 小時內的</text>
<text x="374" y="440" font-size="12.5" fill="#4a5164">抽出純文字＋產生「完整文件」PDF</text>
<text x="374" y="459" font-size="12.5" fill="#4a5164">日期：文件前 12 行 → 沒有就用上傳時間推算週三</text>
<text x="374" y="478" font-size="12.5" fill="#4a5164">寫進 Notion（主題、講員從檔名解析）</text>
<rect x="360" y="515" width="345" height="111" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="515" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="537" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="535" font-size="14.5" font-weight="700" fill="#ffffff">抽問題討論（預查轉完接著做）</text>
<text x="374" y="563" font-size="12.5" fill="#4a5164">① 規則：取最後一段「問題討論／Q&amp;A／心得分享…」</text>
<text x="374" y="582" font-size="12.5" fill="#4a5164">② 規則抓不到才請 Gemini，只收原文找得到的題目</text>
<text x="374" y="601" font-size="12.5" fill="#4a5164">討論日期 ＝ 文件日期 ＋ 7 天</text>
<rect x="360" y="638" width="345" height="92" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="638" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="660" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="658" font-size="14.5" font-weight="700" fill="#ffffff">安排表匯入</text>
<text x="374" y="686" font-size="12.5" fill="#4a5164">每週一重匯本月與下個週三的月份；缺月份隨時補</text>
<text x="374" y="705" font-size="12.5" fill="#4a5164">只取週三那列原文，人工修正欄不覆蓋</text>
