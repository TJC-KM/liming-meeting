<rect x="0" y="0" width="1500" height="922" fill="#fbfbfd" stroke="#d7dae0" rx="8"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#1a1d24">聚會紀錄系統 liming-meeting：資料流程</text>
<text x="30" y="63" font-size="13" fill="#5c6270">兩個畫面：① 聚會紀錄網站（有日期的聚會紀錄）　② 查經邀請頁 study.liming-tjc.org　｜　藍＝聚會紀錄　綠＝查經　金＝AI　灰＝設定／暫存</text>
<text x="30" y="86" font-size="13" font-weight="700" fill="#4a5164">怎麼看：</text>
<text x="86" y="86" font-size="13" fill="#4a5164"><tspan font-weight="700">順著箭頭看</tspan>（左 → 右）：左邊的檔案、設定經過哪些處理，最後出現在哪個畫面</text>
<text x="86" y="106" font-size="13" fill="#4a5164"><tspan font-weight="700">逆著箭頭看</tspan>（右 → 左）：畫面上某一項是從哪裡來的，不對時要去哪裡改</text>
<text x="30" y="142" font-size="14" font-weight="700" fill="#1a1d24">來源</text>
<text x="345" y="142" font-size="14" font-weight="700" fill="#1a1d24">處理</text>
<text x="800" y="142" font-size="14" font-weight="700" fill="#1a1d24">資料</text>
<text x="1170" y="142" font-size="14" font-weight="700" fill="#1a1d24">畫面（只讀，經由 Worker）</text>
<rect x="30" y="162" width="260" height="111" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
