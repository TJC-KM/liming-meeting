<text x="814" y="528" font-size="12.5" fill="#4a5164">安排表分頁：系統匯入</text>
<text x="814" y="547" font-size="12.5" fill="#4a5164">　✎ 人工修正欄有填就用它</text>
<text x="814" y="566" font-size="12.5" fill="#4a5164">問題討論分頁：討論日期、題目</text>
<text x="814" y="585" font-size="12.5" fill="#4a5164">　✎ 可直接改題目、刪列、加列</text>
