<rect x="0" y="0" width="1500" height="880" fill="#fbfbfd" stroke="#d7dae0" rx="8"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#1a1d24">聚會紀錄系統 liming-meeting：資料流程</text>
<text x="30" y="63" font-size="13" fill="#5c6270">兩個畫面：① 聚會紀錄網站（有日期的聚會紀錄）　② 查經邀請頁 study.liming-tjc.org　｜　藍＝聚會紀錄　綠＝查經　金＝AI　灰＝設定／暫存</text>
<text x="30" y="100" font-size="14" font-weight="700" fill="#1a1d24">來源</text>
<text x="345" y="100" font-size="14" font-weight="700" fill="#1a1d24">處理</text>
<text x="800" y="100" font-size="14" font-weight="700" fill="#1a1d24">資料</text>
<text x="1170" y="100" font-size="14" font-weight="700" fill="#1a1d24">畫面（只讀，經由 Worker）</text>
<rect x="30" y="120" width="260" height="111" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
