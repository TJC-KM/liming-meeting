<rect x="0" y="0" width="1500" height="902" fill="#fbfbfd" stroke="#d7dae0" rx="8"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#1a1d24">聚會紀錄系統 liming-meeting：資料流程</text>
<text x="30" y="63" font-size="13" fill="#5c6270">兩個畫面：① 聚會紀錄網站（有日期的聚會紀錄）　② 查經邀請頁 study.liming-tjc.org　｜　藍＝聚會紀錄　綠＝查經　金＝AI　灰＝設定／暫存</text>
<text x="30" y="86" font-size="13" fill="#4a5164"><tspan font-weight="700">怎麼看：</tspan>從右邊的畫面找到區塊 → 看 ← 後面寫的資料 → 往左找是誰寫進去、原本從哪裡來　｜　想知道改一個東西會影響哪裡，就從左邊順著箭頭往右看</text>
<text x="30" y="122" font-size="14" font-weight="700" fill="#1a1d24">來源</text>
<text x="345" y="122" font-size="14" font-weight="700" fill="#1a1d24">處理</text>
<text x="800" y="122" font-size="14" font-weight="700" fill="#1a1d24">資料</text>
<text x="1170" y="122" font-size="14" font-weight="700" fill="#1a1d24">畫面（只讀，經由 Worker）</text>
<rect x="30" y="142" width="260" height="111" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
<rect x="30" y="142" width="260" height="30" fill="#7c9cc4" rx="7"/>
<rect x="30" y="164" width="260" height="8" fill="#7c9cc4"/>
<text x="44" y="162" font-size="14.5" font-weight="700" fill="#ffffff">聚會錄音</text>
<text x="44" y="190" font-size="12.5" fill="#4a5164">Drive 聚會錄音資料夾</text>
<text x="44" y="209" font-size="12.5" fill="#4a5164">同工上傳，檔名開頭要有日期</text>
<text x="44" y="228" font-size="12.5" fill="#4a5164">例：2026-07-25 講題(講員).mp3</text>
<rect x="30" y="271" width="260" height="130" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="30" y="271" width="260" height="30" fill="#7fa87f" rx="7"/>
<rect x="30" y="293" width="260" height="8" fill="#7fa87f"/>
<text x="44" y="291" font-size="14.5" font-weight="700" fill="#ffffff">預查文件</text>
<text x="44" y="319" font-size="12.5" fill="#4a5164">Drive 預查資料夾 → 書卷子資料夾</text>
<text x="44" y="338" font-size="12.5" fill="#4a5164">主領週三晚上上傳（Word／PDF／PPT）</text>
<text x="44" y="357" font-size="12.5" fill="#4a5164">經 LINE 小幫手傳的檔名會變成</text>
<text x="44" y="376" font-size="12.5" fill="#4a5164">　日期_時間_傳送者_原檔名</text>
<rect x="30" y="419" width="260" height="111" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="30" y="419" width="260" height="30" fill="#7fa87f" rx="7"/>
<rect x="30" y="441" width="260" height="8" fill="#7fa87f"/>
<text x="44" y="439" font-size="14.5" font-weight="700" fill="#ffffff">每月聚會安排表</text>
<text x="44" y="467" font-size="12.5" fill="#4a5164">Drive「05安排表」</text>
<text x="44" y="486" font-size="12.5" fill="#4a5164">&lt;民國年&gt;&lt;月&gt;聚會安排表.xlsx</text>
<text x="44" y="505" font-size="12.5" fill="#4a5164">週三那列：進度、預查、領會</text>
<rect x="30" y="548" width="260" height="149" fill="#ffffff" stroke="#8b93a6" stroke-width="1.6" rx="7"/>
<rect x="30" y="548" width="260" height="30" fill="#8b93a6" rx="7"/>
<rect x="30" y="570" width="260" height="8" fill="#8b93a6"/>
<text x="44" y="568" font-size="14.5" font-weight="700" fill="#ffffff">設定試算表（兩本）</text>
<text x="44" y="596" font-size="12.5" fill="#4a5164">查經聚會轉檔紀錄 › Config</text>
<text x="44" y="615" font-size="12.5" fill="#4a5164">　Meet 連結、卡片文字、範本連結</text>
<text x="44" y="634" font-size="12.5" fill="#4a5164">LINE 小幫手那本 › Config</text>
<text x="44" y="653" font-size="12.5" fill="#4a5164">　Gemini 指示、講員清單、略過關鍵字</text>
<text x="44" y="672" font-size="12.5" fill="#4a5164">改完 1 分鐘生效，不用重新部署</text>
<rect x="345" y="134" width="375" height="688" fill="#f1f3f7" stroke="#b9c2d4" rx="8"/>
<text x="359" y="156" font-size="14.5" font-weight="700" fill="#1a1d24">Cloudflare Worker：church-meeting-api</text>
<text x="359" y="176" font-size="12" fill="#5c6270">排程每天 06:30 · 12:30 · 16:00 · 21:30，每次處理一份</text>
<rect x="360" y="192" width="345" height="149" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
<rect x="360" y="192" width="345" height="30" fill="#7c9cc4" rx="7"/>
<rect x="360" y="214" width="345" height="8" fill="#7c9cc4"/>
<text x="374" y="212" font-size="14.5" font-weight="700" fill="#ffffff">錄音轉檔</text>
<text x="374" y="240" font-size="12.5" fill="#4a5164">順序：手動排隊 → 重試（06:30、16:00）→ 新檔</text>
<text x="374" y="259" font-size="12.5" fill="#4a5164">略過：婚禮、喪禮、詩班；&gt;150MB 或 &lt;1MB</text>
<text x="374" y="278" font-size="12.5" fill="#4a5164">下載錄音 → Gemini 整理成</text>
<text x="374" y="297" font-size="12.5" fill="#4a5164">　簡易重點／完整重點／參考經文</text>
<text x="374" y="316" font-size="12.5" fill="#4a5164">寫進 Notion（草稿），失敗自動重試 3 次</text>
<rect x="360" y="353" width="345" height="130" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="353" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="375" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="373" font-size="14.5" font-weight="700" fill="#ffffff">預查轉檔</text>
<text x="374" y="401" font-size="12.5" fill="#4a5164">21:30 處理 14 天內上傳的；06:30 補轉 36 小時內的</text>
<text x="374" y="420" font-size="12.5" fill="#4a5164">抽出純文字＋產生「完整文件」PDF</text>
<text x="374" y="439" font-size="12.5" fill="#4a5164">日期：文件前 12 行 → 沒有就用上傳時間推算週三</text>
<text x="374" y="458" font-size="12.5" fill="#4a5164">寫進 Notion（主題、講員從檔名解析）</text>
<rect x="360" y="495" width="345" height="111" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="495" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="517" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="515" font-size="14.5" font-weight="700" fill="#ffffff">抽問題討論（預查轉完接著做）</text>
<text x="374" y="543" font-size="12.5" fill="#4a5164">① 規則：取最後一段「問題討論／Q&amp;A／心得分享…」</text>
<text x="374" y="562" font-size="12.5" fill="#4a5164">② 規則抓不到才請 Gemini，只收原文找得到的題目</text>
<text x="374" y="581" font-size="12.5" fill="#4a5164">討論日期 ＝ 文件日期 ＋ 7 天</text>
<rect x="360" y="618" width="345" height="92" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="360" y="618" width="345" height="30" fill="#7fa87f" rx="7"/>
<rect x="360" y="640" width="345" height="8" fill="#7fa87f"/>
<text x="374" y="638" font-size="14.5" font-weight="700" fill="#ffffff">安排表匯入</text>
<text x="374" y="666" font-size="12.5" fill="#4a5164">每週一重匯本月與下個週三的月份；缺月份隨時補</text>
<text x="374" y="685" font-size="12.5" fill="#4a5164">只取週三那列原文，人工修正欄不覆蓋</text>
<rect x="360" y="722" width="345" height="73" fill="#ffffff" stroke="#8b93a6" stroke-width="1.6" rx="7"/>
<rect x="360" y="722" width="345" height="30" fill="#8b93a6" rx="7"/>
<rect x="360" y="744" width="345" height="8" fill="#8b93a6"/>
<text x="374" y="742" font-size="14.5" font-weight="700" fill="#ffffff">網頁服務</text>
<text x="374" y="770" font-size="12.5" fill="#4a5164">提供兩個畫面的資料；邀請頁整頁在這裡產生</text>
<rect x="800" y="142" width="270" height="130" fill="#ffffff" stroke="#c9a15c" stroke-width="1.6" rx="7"/>
<rect x="800" y="142" width="270" height="30" fill="#c9a15c" rx="7"/>
<rect x="800" y="164" width="270" height="8" fill="#c9a15c"/>
<text x="814" y="162" font-size="14.5" font-weight="700" fill="#ffffff">Gemini（Google AI）</text>
<text x="814" y="190" font-size="12.5" fill="#4a5164">整理錄音：設定檔的 GEMINI_MODEL</text>
<text x="814" y="209" font-size="12.5" fill="#4a5164">　目前 gemini-flash-latest，每天次數有限</text>
<text x="814" y="228" font-size="12.5" fill="#4a5164">抽問題討論（規則抓不到時）：</text>
<text x="814" y="247" font-size="12.5" fill="#4a5164">　gemini-3.5-flash-lite，額度另計</text>
<rect x="800" y="294" width="270" height="168" fill="#ffffff" stroke="#4a5164" stroke-width="1.6" rx="7"/>
<rect x="800" y="294" width="270" height="30" fill="#4a5164" rx="7"/>
<rect x="800" y="316" width="270" height="8" fill="#4a5164"/>
<text x="814" y="314" font-size="14.5" font-weight="700" fill="#ffffff">Notion「聚會紀錄」資料庫</text>
<text x="814" y="342" font-size="12.5" font-weight="700" fill="#1a1d24">唯一正本，也是後台</text>
<text x="814" y="361" font-size="12.5" fill="#4a5164">聚會日期、類型、主題、講員</text>
<text x="814" y="380" font-size="12.5" fill="#4a5164">內文：AI 整理或預查文字</text>
<text x="814" y="399" font-size="12.5" fill="#4a5164">錄音、預查、完整文件連結</text>
<text x="814" y="418" font-size="12.5" fill="#4a5164">✎ 人工校對、改日期、改講員</text>
<text x="814" y="437" font-size="12.5" fill="#4a5164">✎ 狀態：草稿→已發布；傳錯→不採用</text>
