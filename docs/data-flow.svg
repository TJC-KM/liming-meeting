<text x="814" y="654" font-size="12.5" fill="#4a5164">轉錄排隊：聚會頁按「加入轉錄排隊」</text>
<text x="814" y="673" font-size="12.5" fill="#4a5164">　寫入，下一輪排程處理</text>
<text x="814" y="692" font-size="12.5" fill="#4a5164">行事曆快取、安排表備份</text>
